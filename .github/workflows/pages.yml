name: Deploy (GitHub Pages)

# Publishes the site to GitHub Pages. It runs in one of two modes, chosen by the
# repository variable CUSTOM_DOMAIN (Settings -> Secrets and variables ->
# Actions -> Variables):
#
#   unset / anything else  review copy at https://sandy4243.github.io/Datafore/,
#                          served from a subpath and marked noindex
#   CUSTOM_DOMAIN = true   the real site at https://datafore.ca, served from the
#                          root and indexable
#
# Merging code never flips the mode. The variable is set as one deliberate step of
# the domain cutover — see docs/CUTOVER.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Requires Pages to already be enabled with "GitHub Actions" as the source
      # (Settings -> Pages). Auto-enablement is deliberately not used here: the
      # default workflow token cannot create a Pages site, and asking it to do so
      # fails the run with a misleading "Resource not accessible by integration".
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          # "gh-pages" selects the subpath/noindex build; anything else is the root build.
          DEPLOY_TARGET: ${{ vars.CUSTOM_DOMAIN == 'true' && 'custom-domain' || 'gh-pages' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
